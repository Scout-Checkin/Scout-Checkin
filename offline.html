<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCOUT Offline Check-in</title>

<style>
:root {
  --burgundy:#8b1a1a;
  --bg:#f5f3f1;
  --gray:#666;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:20px;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:#292929;
}
.container {
  max-width:520px;
  margin:20px auto;
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 3px 15px #00000012;
}
h2 { color:var(--burgundy); margin-top:0; }
input,button {
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:9px;
  font-size:16px;
}
input { border:1px solid #ccc; }
button {
  border:0;
  background:var(--burgundy);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled { opacity:.5; }
.secondary { background:#666; }
.status {
  background:#f3f0ee;
  padding:12px;
  border-radius:9px;
  margin:12px 0;
  font-size:14px;
  overflow-wrap:anywhere;
}
.person {
  border:1px solid #ddd;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
}
.small { color:var(--gray); font-size:13px; }
.hidden { display:none; }
</style>
</head>

<body>
<div class="container">
  <h2>SCOUT Offline Check-in</h2>

  <div id="databaseStatus" class="status">
    Database not connected yet. Connect to the internet and download.
  </div>

  <label>Organizer Email</label>
  <input id="email" type="email" placeholder="Enter your email">

  <label>Organizer PIN</label>
  <input id="pin" type="password" placeholder="Enter your PIN">

  <button id="downloadBtn" onclick="downloadDatabase()">
    Download Database
  </button>

  <button class="secondary" onclick="openScanner()">
    Open QR Scanner
  </button>
  <hr>

<h3>Manual Check-in</h3>

<input
  id="manualSearch"
  type="text"
  placeholder="Enter Participant ID or Email"
>

<button onclick="manualLookup()">
  Search Participant
</button>
<button onclick="syncAttendance()">
    Sync Attendance
</button>
  <div id="personBox" class="person hidden">
    <h3 id="personName"></h3>
    <div id="personDetails"></div>
    <button onclick="confirmAttendance()">Confirm Check-in</button>
  </div>

  <div class="status">
    <div>Saved participants: <b id="participantCount">0</b></div>
    <div>Pending check-ins: <b id="pendingCount">0</b></div>
  </div>

  <p class="small">
    Keep this page available on your phone. Download the database while
    connected to the internet before using offline check-in.
  </p>

  <div id="message" class="status">Ready.</div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx_U6bK4tQ0OKVS9SJOgm6qFkW-__WqYSTl1YoLXSbeWXnyu67GHuJiTI6Eysyhlf8a/exec";

const DB_NAME = "SCOUT_OFFLINE_DB";
const DB_VERSION = 1;

let db;
let currentParticipant = null;
let requestNumber = 0;

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

function openDB() {
  return new Promise((resolve,reject) => {
    const request = indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = event => {
      const database = event.target.result;

      if (!database.objectStoreNames.contains("participants")) {
        database.createObjectStore("participants",{keyPath:"id"});
      }

      if (!database.objectStoreNames.contains("attendance")) {
        database.createObjectStore("attendance",{keyPath:"recordId"});
      }
    };

    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };

    request.onerror = () => reject(request.error);
  });
}

function storeData(storeName, data) {
  return new Promise((resolve,reject) => {
    const transaction = db.transaction(storeName,"readwrite");
    const store = transaction.objectStore(storeName);

    data.forEach(item => store.put(item));

    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
  });
}

function getAll(storeName) {
  return new Promise((resolve,reject) => {
    const transaction = db.transaction(storeName,"readonly");
    const request = transaction.objectStore(storeName).getAll();

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function getField(obj, names) {
  if (!obj || typeof obj !== "object") return "";

  const keys = Object.keys(obj);

  for (const name of names) {
    const found = keys.find(
      key => key.toLowerCase().trim() === name.toLowerCase().trim()
    );

    if (found !== undefined) return obj[found];
  }

  return "";
}

function normalizeParticipant(item) {
  const id = String(getField(item,[
    "Participant ID","participantId","id","ID"
  ]) || "").trim();

  if (!id) return null;

  return {
    id:id,
    data:item
  };
}

function extractParticipants(response) {
  let value = response && response.data !== undefined
    ? response.data : response;

  if (Array.isArray(value)) return value;

  const possibleKeys = [
    "participants","data","records","rows","database"
  ];

  for (const key of possibleKeys) {
    if (value && Array.isArray(value[key])) {
      return value[key];
    }
  }

  if (value && value.data) {
    for (const key of possibleKeys) {
      if (Array.isArray(value.data[key])) return value.data[key];
    }
  }

  throw new Error("Participant list was not found in the server response.");
}

function jsonpRequest(params) {
  return new Promise((resolve,reject) => {
    const callbackName = "scoutCallback" + (++requestNumber);
    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Service not responding. Please try again."));
    },30000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = response => {
      cleanup();
      resolve(response);
    };

    const query = new URLSearchParams({
      api:"jsonp",
      callback:callbackName,
      ...params
    });

    script.src = API_URL + "?" + query.toString();

    script.onerror = () => {
      cleanup();
      reject(new Error("Could not connect to SCOUT server."));
    };

    document.body.appendChild(script);
  });
}

async function downloadDatabase() {
  const email = document.getElementById("email").value.trim();
  const pin = document.getElementById("pin").value.trim();
  const button = document.getElementById("downloadBtn");

  if (!email || !pin) {
    showMessage("Please enter organizer email and PIN.");
    return;
  }

  if (!navigator.onLine) {
    showMessage("Internet connection is required to download.");
    return;
  }

  button.disabled = true;
  button.textContent = "Downloading...";
  showMessage("Connecting to SCOUT server...");

  try {
    const response = await jsonpRequest({
      action:"download",
      email:email,
      pin:pin
    });

    if (!response || response.success !== true) {
      throw new Error(response && response.error
        ? response.error : "Download failed.");
    }

    const participants = extractParticipants(response);
    const normalized = participants
      .map(normalizeParticipant)
      .filter(Boolean);

    if (!normalized.length) {
      throw new Error("No participant records were returned.");
    }

    await storeData("participants",normalized);

    document.getElementById("databaseStatus").textContent =
      "Database downloaded successfully.";

    showMessage("Database downloaded: " + normalized.length + " participants.");
    await refreshCounts();

  } catch(error) {
    showMessage("Error: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Download Database";
  }
}

async function refreshCounts() {
  const participants = await getAll("participants");
  const attendance = await getAll("attendance");

  document.getElementById("participantCount").textContent =
    participants.length;

  document.getElementById("pendingCount").textContent =
    attendance.length;

  if (participants.length) {
    document.getElementById("databaseStatus").textContent =
      "Local database ready: " + participants.length + " participants.";
  }
}
async function syncAttendance() {
  const email = document.getElementById("email").value.trim();
  const pin = document.getElementById("pin").value.trim();

  if (!navigator.onLine) {
    showMessage("Internet connection is required to sync.");
    return;
  }

  if (!email || !pin) {
    showMessage("Enter organizer email and PIN first.");
    return;
  }

  try {
    const records = await getAll("attendance");

    if (!records.length) {
      showMessage("No pending attendance records.");
      return;
    }

    showMessage("Syncing " + records.length + " attendance record(s)...");

    let synced = 0;

    for (const record of records) {
      const response = await jsonpRequest({
        action: "sync",
        email: email,
        pin: pin,
        record: JSON.stringify(record)
      });

      if (!response || response.success !== true) {
        throw new Error(
          response && response.error
            ? response.error
            : "Sync failed."
        );
      }

      await new Promise((resolve, reject) => {
        const transaction = db.transaction("attendance", "readwrite");
        transaction.objectStore("attendance").delete(record.recordId);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });

      synced++;
    }

    showMessage("Successfully synced " + synced + " attendance record(s).");
    await refreshCounts();

  } catch (error) {
    showMessage("Sync error: " + error.message);
    await refreshCounts();
  }
}
  async function manualLookup() {
  const searchValue = document
    .getElementById("manualSearch")
    .value.trim().toLowerCase();

  if (!searchValue) {
    showMessage("Enter Participant ID or Email.");
    return;
  }

  try {
    const participants = await getAll("participants");

    const participant = participants.find(item => {
      const email = String(
        getField(item.data, ["Email"])
      ).trim().toLowerCase();

      return item.id.toLowerCase() === searchValue ||
             email === searchValue;
    });

    if (!participant) {
      currentParticipant = null;
      document.getElementById("personBox").classList.add("hidden");
      showMessage("Participant not found in local database.");
      return;
    }

    currentParticipant = participant;

    const data = participant.data;

    document.getElementById("personName").textContent =
      getField(data, ["Full Name", "Name", "fullName"]) ||
      participant.id;

    const details = [
      ["Participant ID", participant.id],
      ["Email", getField(data, ["Email"])],
      ["University", getField(data, ["University"])],
      ["Faculty", getField(data, ["Faculty"])],
      ["Academic Year", getField(data, ["Academic Year"])]
    ];

    document.getElementById("personDetails").innerHTML =
      details.map(item =>
        "<p><b>" + escapeHTML(item[0]) + ":</b> " +
        escapeHTML(String(item[1] || "-")) + "</p>"
      ).join("");

    document.getElementById("personBox").classList.remove("hidden");

    showMessage("Participant found. Confirm attendance when ready.");

  } catch (error) {
    showMessage("Search error: " + error.message);
  }
}
function openScanner() {
  window.open(
    "https://scout-checkin.github.io/Scout-Checkin/Scanner.html",
    "_blank"
  );
}

window.addEventListener("message", async event => {
  if (event.origin !== "https://scout-checkin.github.io") return;

  const message = event.data;

  if (!message || message.type !== "SCOUT_QR_SCANNED") return;

  const participantId = String(message.participantId || "").trim();

  if (!participantId) return;

  const participants = await getAll("participants");

  const participant = participants.find(
    item => item.id.toLowerCase() === participantId.toLowerCase()
  );

  if (!participant) {
    currentParticipant = null;
    document.getElementById("personBox").classList.add("hidden");
    showMessage("Participant not found in the local database. Download the database first.");
    return;
  }

  currentParticipant = participant;

  const data = participant.data;
  const name = getField(data,["Full Name","Name","fullName"]);

  document.getElementById("personName").textContent =
    name || participant.id;

  const details = [
    ["Participant ID",participant.id],
    ["Email",getField(data,["Email"])],
    ["University",getField(data,["University"])],
    ["Faculty",getField(data,["Faculty"])],
    ["Academic Year",getField(data,["Academic Year"])]
  ];

  document.getElementById("personDetails").innerHTML =
    details.map(item =>
      "<p><b>" + escapeHTML(item[0]) + ":</b> " +
      escapeHTML(String(item[1] || "-")) + "</p>"
    ).join("");

  document.getElementById("personBox").classList.remove("hidden");
  showMessage("Participant found. Confirm attendance when ready.");
});

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

async function confirmAttendance() {
  if (!currentParticipant) return;

  const record = {
    recordId: "SCOUT-" + currentParticipant.id + "-" + Date.now(),
    participantId: currentParticipant.id,
    participantName: getField(
      currentParticipant.data,["Full Name","Name","fullName"]
    ),
    organizerEmail:document.getElementById("email").value.trim(),
    checkInTime:new Date().toISOString(),
    method:"QR",
    syncStatus:"PENDING"
  };

  try {
    await storeData("attendance",[record]);
    showMessage("Check-in saved on this device. It is waiting to sync.");
    document.getElementById("personBox").classList.add("hidden");
    currentParticipant = null;
    await refreshCounts();
  } catch(error) {
    showMessage("Could not save check-in: " + error.message);
  }
}

(async function start() {
  try {
    await openDB();
    await refreshCounts();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  } catch(error) {
    showMessage("Local database error: " + error.message);
  }
})();
</script>
</body>
</html>
