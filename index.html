<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8b1a1a">
  <title>SCOUT Live QR Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f3f1;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: 25px auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }

    h2 { color: #8b1a1a; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #8b1a1a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      background: #222;
    }

    #result {
      margin-top: 18px;
      padding: 15px;
      background: #f5f3f1;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .status {
      font-size: 13px;
      color: #666;
      margin-top: 12px;
    }

    .success { color: #187a39; font-weight: bold; }
    .error { color: #b3261e; }
  </style>
</head>

<body>
  <div class="container">
    <h2>SCOUT QR Scanner</h2>
    <p>Point the camera at the participant's QR code.</p>

    <div id="connection" class="status">Checking connection...</div>

    <video id="video" playsinline muted></video>
    <canvas id="canvas" hidden></canvas>

    <button id="startBtn" onclick="startScanner()">Start Live Scanner</button>
    <button id="stopBtn" onclick="stopScanner()" disabled>Stop Scanner</button>

    <div id="result">Waiting for QR code...</div>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const resultBox = document.getElementById("result");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const connection = document.getElementById("connection");

    let stream = null;
    let scanning = false;
    let animationFrame = null;
    let lastScanned = "";

    function updateConnection() {
      connection.textContent = navigator.onLine
        ? "Internet connection: Online"
        : "Internet connection: Offline — QR scanning is available";
    }

    window.addEventListener("online", updateConnection);
    window.addEventListener("offline", updateConnection);
    updateConnection();

    async function startScanner() {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        resultBox.innerHTML =
          '<span class="error">Camera requires a secure HTTPS connection.</span>';
        return;
      }

      if (typeof window.jsQR !== "function") {
        resultBox.innerHTML =
          '<span class="error">QR library is not loaded. Connect to the internet and reopen the page.</span>';
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        scanning = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        resultBox.textContent = "Scanning...";
        scanFrame();

      } catch (error) {
        resultBox.innerHTML =
          '<span class="error">Could not open camera. Please allow camera permission.</span>';
      }
    }

    function scanFrame() {
      if (!scanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(
          0, 0, canvas.width, canvas.height
        );

        const code = window.jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          { inversionAttempts: "dontInvert" }
        );

        if (code && code.data) {
          const id = code.data.trim();

          if (/^SC-\d+$/i.test(id) && id !== lastScanned) {
            lastScanned = id;
            handleScannedID(id);
            return;
          }
        }
      }

      animationFrame = requestAnimationFrame(scanFrame);
    }

    function handleScannedID(id) {
      scanning = false;

      resultBox.innerHTML =
        '<div class="success">QR Code detected!</div><br>' +
        '<strong>' + id + '</strong>';

      stopCamera();

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: "SCOUT_QR_SCANNED",
          participantId: id
        }, "https://scout-checkin.github.io");

        setTimeout(() => window.close(), 500);
      } else {
        resultBox.innerHTML +=
          "<p>Scanner opened independently. Copy this ID to the Check-in page.</p>";
      }
    }

    function stopCamera() {
      scanning = false;

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    function stopScanner() {
      stopCamera();
      resultBox.textContent = "Scanner stopped.";
      lastScanned = "";
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
          console.log("SCOUT Offline support registered.");
        } catch (error) {
          console.error("Offline registration failed:", error);
        }
      });
    }
  </script>
</body>
</html>
